name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Для PR проверяем версию автора (head SHA), а не временный merge-коммит
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked SHA
        run: git rev-parse HEAD | tee checked-sha.txt
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
      - run: mise run install
      - run: npm exec --prefix frontend -- playwright install-deps chromium
      - run: mise run check
        env:
          PW_TRACE: "on"
      - name: Upload browser check (trace + SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            checked-sha.txt
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-calendar .
      - name: container starts on $PORT
        run: |
          docker run -d --name app -e PORT=3000 -p 3000:3000 call-calendar
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/event-types && break; sleep 2; done
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf http://localhost:3000/api/event-types
