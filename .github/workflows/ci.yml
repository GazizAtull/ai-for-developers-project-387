name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: npm exec --prefix frontend -- playwright install-deps chromium
      - run: mise run check

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-calendar .
      - name: container starts on $PORT
        run: |
          docker run -d --name app -e PORT=3000 -p 3000:3000 call-calendar
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/event-types && break; sleep 2; done
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf http://localhost:3000/api/event-types
