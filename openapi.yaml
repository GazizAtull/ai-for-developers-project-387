openapi: 3.0.0
info:
  title: Календарь звонков
  version: 0.0.0
tags:
  - name: event-types
  - name: bookings
paths:
  /api/bookings:
    get:
      operationId: listBookings
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      tags:
        - bookings
    post:
      operationId: createBooking
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
  /api/event-types:
    get:
      operationId: listEventTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - event-types
    post:
      operationId: createEventType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - event-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /api/event-types/{id}/availability:
    get:
      operationId: getAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - event-types
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      description: 'Код ошибки: VALIDATION_ERROR, EVENT_TYPE_EXISTS, EVENT_TYPE_NOT_FOUND, SLOT_UNAVAILABLE, SLOT_TAKEN.'
    Availability:
      type: object
      required:
        - timezone
        - days
      properties:
        timezone:
          type: string
          description: IANA-часовой пояс владельца, например Asia/Almaty.
        days:
          type: array
          items:
            $ref: '#/components/schemas/SlotDay'
          description: Ровно 14 календарных дней начиная с сегодняшнего.
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - start
        - end
        - guestName
        - guestEmail
      properties:
        id:
          type: string
          format: uuid
        eventTypeId:
          type: string
        eventTypeTitle:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        topic:
          type: string
          maxLength: 300
          description: Тема разговора. Поля нет или `null`, если гость её не указал.
    CreateBooking:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: Начало слота, один из стартов из ответа /availability.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
        guestEmail:
          type: string
          format: email
        topic:
          type: string
          maxLength: 300
          description: 'Тема разговора: о чём гость хочет поговорить. Необязательно, до 300 символов.'
    CreateEventType:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,50}$
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,50}$
          description: 'Идентификатор, который задаёт владелец: латиница в нижнем регистре, цифры и дефис.'
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
          description: Длительность в минутах, кратна 5.
      description: Тип встречи, который создаёт владелец календаря.
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: Свободный слот. Время в UTC, день и часы показываются в часовом поясе владельца.
    SlotDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
          description: Календарная дата в часовом поясе владельца.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
servers:
  - url: /
    description: Same origin
    variables: {}
